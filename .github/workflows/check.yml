name: Version Check
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * MON,THU"
  push:
    branches: [master, test]
jobs:
  check:
    name: Check new version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Get token
        id: get_token
        uses: machine-learning-apps/actions-app-token@master
        with:
          APP_PEM: ${{ secrets.ARCHLINUXCN_JULIA_BOT_PEM }}
          APP_ID: ${{ secrets.ARCHLINUXCN_JULIA_BOT_ID }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.get_token.outputs.app_token }}
      - uses: actions/cache@v6
        env:
          cache-name: cache-julia
        with:
          path: ~/.julia/
          # Rolling key so that the cache is saved after every run
          # and the most recent one is restored via the prefix match.
          # Change the prefix to start from a clean cache.
          key: version-check-dot-julia-1.11.6-x64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: version-check-dot-julia-1.11.6-x64-
      # Cache for immutable package information (tree hash -> commit / content info).
      # Uses a unique key for each run so that the cache is saved every time
      # and restores the most recent one via the prefix match.
      - name: Restore package info cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/archcn-info-cache
          key: version-check-info-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: version-check-info-cache-
      - uses: julia-actions/setup-julia@v3
        with:
          version: 1.11.6
          arch: x64
      - name: Install dependencies
        run: |
          julia -e '
            using Pkg
            Pkg.add("GitHubActions")'
      - name: Check version
        id: check
        env:
          JL_ARCHCN_INFO_CACHE: ${{ runner.temp }}/archcn-info-cache
        run: julia --threads=auto scripts/check_update.jl
      - name: Save package info cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/archcn-info-cache
          key: version-check-info-cache-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Send notification
        uses: cinotify/github-action@main
        continue-on-error: true
        if: ${{ steps.check.outputs.has_messages == 1 }}
        with:
          to: 'yyc1992@gmail.com'
          subject: 'Julia package update results'
          type: 'text/plain'
          body: ${{ steps.check.outputs.messages }}
      - name: Commit changes
        if: ${{ steps.check.outputs.has_change == 1 }}
        run: |
          git config --global user.name 'Yichao Yu'
          git config --global user.email 'yuyichao@users.noreply.github.com'
          git status
          git add .
          git commit -m "Automatic version update" -m "[skip actions]"
          git push
